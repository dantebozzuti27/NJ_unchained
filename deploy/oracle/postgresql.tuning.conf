# PostgreSQL 16 tuning for Oracle Cloud Always Free VM.Standard.A1.Flex
# (4 OCPU ARM Ampere, 24 GB RAM, 200 GB block storage), single-tenant,
# OLAP-leaning workload: full-table scans + window functions (CUME_DIST)
# over ~1.8M-row provider files, very low concurrency.
#
# Drop this in as /etc/postgresql/16/main/conf.d/10-nj-tuning.conf so it
# overrides the packaged defaults without editing the base postgresql.conf.
#
# Sizing rationale (PostgreSQL docs "Resource Consumption" + the long-standing
# 25%/75% memory split; values are deliberately conservative for a 24 GB box
# that ALSO runs Dagster + FastAPI + Caddy per AGENTS.md):

# --- Memory --------------------------------------------------------------
# 25% of RAM is the classic shared_buffers starting point.
shared_buffers = 6GB
# 75% of RAM: planner's estimate of OS page cache + shared_buffers. Not an
# allocation, just a cost-model hint that favors index/seq plans correctly.
effective_cache_size = 18GB
# Bulk loads + CREATE INDEX after the national ingest want a big work area.
maintenance_work_mem = 2GB
# Per-sort/hash node. Our window functions + large GROUP BYs spill without it.
# Bounded by max_connections (40) * (a few nodes) so worst case stays << 24GB.
work_mem = 128MB

# --- Connections ---------------------------------------------------------
# Single-tenant; Dagster daemon + FastAPI pool + a few analyst sessions.
max_connections = 40

# --- WAL / checkpoints ---------------------------------------------------
# Large to absorb the 5M-row national bulk load without checkpoint storms.
max_wal_size = 8GB
min_wal_size = 2GB
checkpoint_completion_target = 0.9
# CPU is cheap vs the 200 GB block-volume IO budget; compress WAL.
wal_compression = on

# --- Storage / planner ---------------------------------------------------
# Block volume is network-attached NVMe-class SSD: random ~= sequential.
random_page_cost = 1.1
effective_io_concurrency = 200
# Larger stats target sharpens plans on the wide CMS tables.
default_statistics_target = 200

# --- Parallelism (4 OCPU) ------------------------------------------------
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# --- JIT -----------------------------------------------------------------
# Our hot queries are short-planned aggregates where JIT compile time tends to
# cost more than it saves; leave off and revisit with EXPLAIN ANALYZE evidence.
jit = off

# --- Network posture -----------------------------------------------------
# Default to localhost-only: connect over an SSH tunnel (see README). Flip to
# '*' ONLY together with a restrictive Oracle security list + pg_hba rule.
listen_addresses = 'localhost'
